name: leukquant_mobile
description: "LeukQuant Mobile Client - Autonomous Decoy & Honeytoken Security Monitoring"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.1.0
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.16
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
